<title>@name@</title>
<meta name="description" content="@description@" />
<link rel="manifest" href="/trgblb/sim.webmanifest">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="@name@">
<meta name="apple-mobile-web-app-status-bar-style" content="translucent-black">
<meta name="format-detection" content="telephone=no">
<meta name="application-name" content="@name@">
@appstoremeta@
<meta name="msapplication-TileColor" content="@accentColor@">
<meta name="msapplication-TileImage" content="/docs/static/icons/apple-touch-icon.png">
<meta name="msapplication-config" content="none"/>
<meta name="theme-color" content="@accentColor@">

<meta name="twitter:card" content="summary" />
<meta name="twitter:site" content="@ptwitter@" />
<meta name="twitter:title" content="@name@" />

<meta name="twitter:image" content="/docs/static/icons/apple-touch-icon.png" />

<meta property="og:title" content="@name@" />
<meta property="og:site_name" content="@name@" />

<meta property="og:image" content="/docs/static/icons/apple-touch-icon.png" />

<link rel="apple-touch-icon" sizes="180x180" href="/docs/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/docs/static/icons/favicon-32x32.png">

<link rel="shortcut icon" href="/docs/static/icons/favicon.ico">
